{% extends "base.html" %}
{% block title %}Entrar - Velkgram{% endblock %}
{% block content %}
<section class="login-card" aria-labelledby="login-title">
  <p class="login-brand" aria-hidden="true">Velkgram</p>
  <h1 id="login-title">Entrar</h1>
  {% if error %}<p class="error" role="alert"><i aria-hidden="true">error</i> {{ error }}</p>{% endif %}
  <form class="stack" method="post" action="/login">
    <div class="field label border">
      <input id="username" type="text" name="username" placeholder=" " autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required>
      <label for="username">Usuário</label>
    </div>
    <div class="field label border">
      <input id="password" type="password" name="password" placeholder=" " autocomplete="current-password" required>
      <label for="password">Senha</label>
    </div>
    <button type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
