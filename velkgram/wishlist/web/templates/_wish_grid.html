<section id="wishes" class="feed wish-grid" aria-label="Desejos">
  {% for card in cards %}
    {% with wish = card.wish, stats = card.stats %}{% include "_wish_row.html" %}{% endwith %}
  {% else %}
    <div class="empty">
      <i aria-hidden="true">favorite</i>
      <p class="empty-title">Nenhum desejo ainda</p>
      <p class="muted">Cadastre o que você procura e o Velkgram avisa quando aparecer uma oferta abaixo do seu limite.</p>
    </div>
  {% endfor %}
</section>
