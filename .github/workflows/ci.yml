name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      # In parallel; --dist loadfile keeps a file's tests on one worker (the volume tests build
      # their 50k-offer database once per file).
      - run: uv run pytest -q -n auto --dist loadfile
      - run: uv run pytest -q -m slow -n auto --dist loadfile
      - run: uv run ty check
        continue-on-error: true
