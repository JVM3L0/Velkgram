x-velkgram: &velkgram
  image: velkgram
  build: .
  env_file: .env
  environment:
    DB_PATH: /app/data/velkgram.db
  volumes:
    - ./data:/app/data

services:
  migrate:
    <<: *velkgram
    command: ["velkgram", "migrate"]
    restart: "no"

  collector:
    <<: *velkgram
    command: ["velkgram", "collector"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "velkgram.apps.healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  enricher:
    <<: *velkgram
    command: ["velkgram", "enrich"]
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    <<: *velkgram
    command:
      - uvicorn
      - --factory
      - velkgram.apps.web.main:create_app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
