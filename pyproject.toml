forbidden_modules = [
  "velkgram.channels.domain", "velkgram.channels.ports", "velkgram.channels.services", "velkgram.channels.adapters", "velkgram.channels.web",
  "velkgram.wishlist.domain", "velkgram.wishlist.ports", "velkgram.wishlist.services", "velkgram.wishlist.adapters", "velkgram.wishlist.web",
  "velkgram.ingestion.domain", "velkgram.ingestion.ports", "velkgram.ingestion.services", "velkgram.ingestion.adapters", "velkgram.ingestion.web",
  "velkgram.alerting.domain", "velkgram.alerting.ports", "velkgram.alerting.services", "velkgram.alerting.adapters", "velkgram.alerting.web",
  "velkgram.reporting",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "shared depends on no business module"
type = "forbidden"
source_modules = ["velkgram.shared"]
forbidden_modules = ["velkgram.channels", "velkgram.wishlist", "velkgram.ingestion", "velkgram.alerting", "velkgram.offers", "velkgram.reporting", "velkgram.apps"]

[[tool.importlinter.contracts]]
name = "domain is pure (rule 1)"
type = "forbidden"
source_modules = ["velkgram.*.domain"]
forbidden_modules = ["sqlite3", "httpx", "telethon", "fastapi", "starlette", "jinja2",
  "velkgram.*.ports", "velkgram.*.services", "velkgram.*.adapters", "velkgram.*.web",
  "velkgram.shared.db", "velkgram.shared.config", "velkgram.shared.adapters", "velkgram.shared.logging",
  "velkgram.shared.migrate", "velkgram.shared.ports", "velkgram.apps"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "services do no I/O (rule 2)"
type = "forbidden"
source_modules = ["velkgram.*.services"]
forbidden_modules = ["sqlite3", "httpx", "telethon", "fastapi", "starlette", "jinja2",
  "velkgram.*.adapters", "velkgram.*.web", "velkgram.shared.db", "velkgram.shared.adapters", "velkgram.apps"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "only apps import adapters (rule 4)"
type = "forbidden"
source_modules = ["velkgram.wishlist.web", "velkgram.channels.web", "velkgram.ingestion.web", "velkgram.alerting.web", "velkgram.offers.web", "velkgram.*.ports", "velkgram.shared.events", "velkgram.shared.ports",
  "velkgram.shared.text", "velkgram.shared.deals", "velkgram.shared.config", "velkgram.shared.db", "velkgram.shared.logging", "velkgram.shared.migrate"]
forbidden_modules = ["velkgram.*.adapters", "velkgram.apps"]
allow_indirect_imports = true
