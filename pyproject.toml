[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "velkgram"
version = "0.2.0"
description = "Alerts on Telegram deals"
requires-python = ">=3.13"
dependencies = [
  "telethon",
  "fastapi",
  "uvicorn[standard]",
  "jinja2",
  "python-multipart",
  "itsdangerous",
]

[project.scripts]
velkgram = "velkgram.apps.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "pyright", "import-linter", "ty", "httpx"]

[tool.hatch.build.targets.wheel]
packages = ["velkgram"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib -m 'not slow'"
markers = ["slow: long-running performance tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.13"
include = ["velkgram", "tests"]
strict = ["velkgram/shared", "velkgram/*/domain", "velkgram/*/services"]

[tool.importlinter]
root_package = "velkgram"
include_external_packages = true

# Rules 3/5: one contract per module. Other modules' packages (public API) stay importable;
# indirect imports through a package __init__ are allowed.
[[tool.importlinter.contracts]]
name = "channels boundary"
type = "forbidden"
source_modules = ["velkgram.channels"]
forbidden_modules = [
  "velkgram.wishlist.domain", "velkgram.wishlist.ports", "velkgram.wishlist.services", "velkgram.wishlist.adapters", "velkgram.wishlist.web",
  "velkgram.ingestion.domain", "velkgram.ingestion.ports", "velkgram.ingestion.services", "velkgram.ingestion.adapters", "velkgram.ingestion.web",
  "velkgram.alerting.domain", "velkgram.alerting.ports", "velkgram.alerting.services", "velkgram.alerting.adapters", "velkgram.alerting.web",
  "velkgram.offers.domain", "velkgram.offers.ports", "velkgram.offers.services", "velkgram.offers.adapters", "velkgram.offers.web",
  "velkgram.reporting",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "wishlist boundary"
type = "forbidden"
source_modules = ["velkgram.wishlist"]
forbidden_modules = [
  "velkgram.channels.domain", "velkgram.channels.ports", "velkgram.channels.services", "velkgram.channels.adapters", "velkgram.channels.web",
  "velkgram.ingestion.domain", "velkgram.ingestion.ports", "velkgram.ingestion.services", "velkgram.ingestion.adapters", "velkgram.ingestion.web",
  "velkgram.alerting.domain", "velkgram.alerting.ports", "velkgram.alerting.services", "velkgram.alerting.adapters", "velkgram.alerting.web",
  "velkgram.offers.domain", "velkgram.offers.ports", "velkgram.offers.services", "velkgram.offers.adapters", "velkgram.offers.web",
  "velkgram.reporting",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "ingestion boundary"
type = "forbidden"
source_modules = ["velkgram.ingestion"]
forbidden_modules = [
  "velkgram.channels.domain", "velkgram.channels.ports", "velkgram.channels.services", "velkgram.channels.adapters", "velkgram.channels.web",
  "velkgram.wishlist.domain", "velkgram.wishlist.ports", "velkgram.wishlist.services", "velkgram.wishlist.adapters", "velkgram.wishlist.web",
  "velkgram.alerting.domain", "velkgram.alerting.ports", "velkgram.alerting.services", "velkgram.alerting.adapters", "velkgram.alerting.web",
  "velkgram.offers.domain", "velkgram.offers.ports", "velkgram.offers.services", "velkgram.offers.adapters", "velkgram.offers.web",
  "velkgram.reporting",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "alerting boundary"
type = "forbidden"
source_modules = ["velkgram.alerting"]
forbidden_modules = [
  "velkgram.channels.domain", "velkgram.channels.ports", "velkgram.channels.services", "velkgram.channels.adapters", "velkgram.channels.web",
  "velkgram.wishlist.domain", "velkgram.wishlist.ports", "velkgram.wishlist.services", "velkgram.wishlist.adapters", "velkgram.wishlist.web",
  "velkgram.ingestion.domain", "velkgram.ingestion.ports", "velkgram.ingestion.services", "velkgram.ingestion.adapters", "velkgram.ingestion.web",
  "velkgram.offers.domain", "velkgram.offers.ports", "velkgram.offers.services", "velkgram.offers.adapters", "velkgram.offers.web",
  "velkgram.reporting",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "reporting boundary"
type = "forbidden"
source_modules = ["velkgram.reporting"]
forbidden_modules = [
  "velkgram.channels.domain", "velkgram.channels.ports", "velkgram.channels.services", "velkgram.channels.adapters", "velkgram.channels.web",
  "velkgram.wishlist.domain", "velkgram.wishlist.ports", "velkgram.wishlist.services", "velkgram.wishlist.adapters", "velkgram.wishlist.web",
  "velkgram.ingestion.domain", "velkgram.ingestion.ports", "velkgram.ingestion.services", "velkgram.ingestion.adapters", "velkgram.ingestion.web",
  "velkgram.alerting.domain", "velkgram.alerting.ports", "velkgram.alerting.services", "velkgram.alerting.adapters", "velkgram.alerting.web",
  "velkgram.offers.domain", "velkgram.offers.ports", "velkgram.offers.services", "velkgram.offers.adapters", "velkgram.offers.web",
]
